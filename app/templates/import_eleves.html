{% extends "base.html" %}

{% block title %}Importer des eleves - KLASORA{% endblock %}

{% block content %}
<div class="container-fluid py-3 px-md-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h4 mb-1 fw-bold text-gray-800">
                <i class="fas fa-file-import text-primary me-2"></i>Importer des eleves
            </h1>
            <p class="text-muted mb-0 small">
                {% if annee_consultee %}
                Annee consultee : <strong>{{ annee_consultee.nom }}</strong>
                {% else %}
                Aucune annee scolaire disponible.
                {% endif %}
            </p>
        </div>
        <a href="{{ url_for('main.eleves') }}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i>Retour
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="POST" action="{{ url_for('main.import_excel_form') }}" enctype="multipart/form-data">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="file" class="form-label fw-semibold">Fichier Excel (.xlsx)</label>
                    <input type="file" class="form-control" id="file" name="file" accept=".xlsx" required>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-upload me-1"></i>Previsualiser
                    </button>
                    <a href="{{ url_for('main.modele_excel_eleves') }}" class="btn btn-outline-secondary">
                        <i class="fas fa-download me-1"></i>Modele Excel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
