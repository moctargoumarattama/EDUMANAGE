<!-- =========================================================================
     MODAL POPUP : CENTRE DE VIGILANCE & ALERTES SCOLAIRES
     Accès direct depuis la Topbar & Mobile - Filtres rapides et traitement 1 clic
     ========================================================================= -->
<div class="modal fade" id="modalCentreAlertes" tabindex="-1" aria-labelledby="modalCentreAlertesLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; overflow: hidden;">
            
            <!-- Header du modal -->
            <div class="modal-header border-bottom py-3 px-4 bg-light d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2.5">
                    <div class="d-flex align-items-center justify-content-center bg-warning-subtle text-warning-emphasis rounded-circle" style="width: 40px; height: 40px;">
                        <i class="fas fa-bell fs-5"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold text-dark mb-0 d-flex align-items-center gap-2" id="modalCentreAlertesLabel">
                            Centre d'Alertes Scolaires
                            <span class="badge bg-danger rounded-pill px-2 py-0.5 fs-7 d-none" id="modalAlertesHeaderBadge">0</span>
                        </h5>
                        <p class="text-muted small mb-0" style="font-size: 0.78rem;">
                            Vigilance continue : impayés de scolarité, absences et difficultés académiques
                        </p>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-success fw-semibold d-inline-flex align-items-center gap-1 rounded-pill px-3 py-1" id="btnModalMarkAllRead" title="Marquer toutes les alertes comme traitées">
                        <i class="fas fa-check-double"></i>
                        <span class="d-none d-sm-inline">Tout traiter</span>
                    </button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>
            </div>

            <!-- Barre de navigation des filtres (Tabs) -->
            <div class="px-4 pt-3 pb-2 bg-white border-bottom">
                <!-- Onglets principaux avec compteurs réactifs -->
                <div class="d-flex align-items-center gap-1.5 flex-wrap mb-2" id="modalAlertesTabs">
                    <button type="button" class="modal-alert-tab-btn active" data-filter="all">
                        <i class="fas fa-layer-group me-1"></i>Toutes
                        <span class="badge bg-secondary ms-1" id="mTabCountAll">0</span>
                    </button>
                    <button type="button" class="modal-alert-tab-btn" data-filter="jamais_paye">
                        <i class="fas fa-hand-holding-usd text-danger me-1"></i>Jamais payé
                        <span class="badge bg-danger ms-1" id="mTabCountJamaisPaye">0</span>
                    </button>
                    <button type="button" class="modal-alert-tab-btn" data-filter="Paiements">
                        <i class="fas fa-money-bill-wave text-danger me-1"></i>Paiements
                        <span class="badge bg-danger-subtle text-danger border border-danger-subtle ms-1" id="mTabCountPaiements">0</span>
                    </button>
                    <button type="button" class="modal-alert-tab-btn" data-filter="Absences">
                        <i class="fas fa-calendar-times text-warning me-1"></i>Absences
                        <span class="badge bg-warning text-dark ms-1" id="mTabCountAbsences">0</span>
                    </button>
                    <button type="button" class="modal-alert-tab-btn" data-filter="Notes">
                        <i class="fas fa-graduation-cap text-primary me-1"></i>Notes
                        <span class="badge bg-primary ms-1" id="mTabCountNotes">0</span>
                    </button>
                    <button type="button" class="modal-alert-tab-btn" data-filter="traitee">
                        <i class="fas fa-check-circle text-success me-1"></i>Traitées
                        <span class="badge bg-success-subtle text-success ms-1" id="mTabCountTraitees">0</span>
                    </button>
                </div>

                <!-- Ligne de recherche & filtre classe -->
                <div class="row g-2 align-items-center pt-1">
                    <div class="col-12 col-sm-7">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="fas fa-search"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 ps-0" id="modalAlertesSearchInput" placeholder="Rechercher élève, classe, motif...">
                            <button class="btn btn-outline-secondary border-start-0 d-none" type="button" id="btnModalClearSearch">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-12 col-sm-5 text-sm-end">
                        <select class="form-select form-select-sm" id="modalAlertesClassFilter">
                            <option value="all">Toutes les classes</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Corps scrollable avec les alertes -->
            <div class="modal-body p-3 p-sm-4 bg-light" style="min-height: 280px; max-height: 58vh; overflow-y: auto;">
                <!-- Loading State -->
                <div class="text-center py-5" id="modalAlertesLoading">
                    <div class="spinner-border text-primary" role="status" style="width: 2.2rem; height: 2.2rem;">
                        <span class="visually-hidden">Chargement des alertes...</span>
                    </div>
                    <p class="text-muted small mt-2 mb-0">Chargement des alertes scolaires...</p>
                </div>

                <!-- Empty State -->
                <div class="text-center py-5 d-none" id="modalAlertesEmpty">
                    <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle mb-3" style="width: 58px; height: 58px;">
                        <i class="fas fa-check-circle fs-2"></i>
                    </div>
                    <h6 class="fw-bold text-dark mb-1">Aucune alerte à signaler</h6>
                    <p class="text-muted small mb-0" id="modalAlertesEmptyMsg">
                        Tout est sous contrôle ! Aucun impayé critique, absence répétée ou difficulté signalée.
                    </p>
                </div>

                <!-- Liste dynamique des cartes d'alertes -->
                <div class="d-flex flex-column gap-2.5 d-none" id="modalAlertesList">
                    <!-- Injecté par modal_centre_alertes.js -->
                </div>
            </div>

            <!-- Footer du modal -->
            <div class="modal-footer py-2.5 px-4 bg-white border-top d-flex align-items-center justify-content-between">
                <div class="small text-muted d-flex align-items-center gap-2">
                    <span id="modalAlertesFooterStats">0 alerte</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="btnModalRefreshAlertes" title="Actualiser les alertes">
                        <i class="fas fa-sync-alt me-1"></i>Actualiser
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary rounded-pill px-3" data-bs-dismiss="modal">
                        Fermer
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>
