<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4361ee">
    <title>Hors connexion - KLASORA</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/static/img/icons/icon-192x192.png">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a0ca3;
            --surface: #ffffff;
            --bg: #f6f7fb;
            --text: #172033;
            --muted: #5f6b7a;
            --border: #e4e8f0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
        }

        .offline-card {
            width: min(100%, 430px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 18px 45px rgba(33, 45, 80, 0.12);
            padding: 26px 22px;
            text-align: center;
        }

        .offline-logo {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            object-fit: cover;
            margin-bottom: 18px;
            box-shadow: 0 8px 24px rgba(67, 97, 238, 0.18);
        }

        .offline-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            margin-bottom: 14px;
            border-radius: 999px;
            background: #eef2ff;
            color: #3151d3;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .offline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e11d48;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(1.35rem, 6vw, 1.75rem);
            line-height: 1.18;
            font-weight: 800;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .offline-note {
            margin-top: 16px;
            padding: 12px;
            border-radius: 14px;
            background: #fff7ed;
            color: #8a4b0f;
            font-weight: 650;
            font-size: 0.92rem;
        }

        .offline-actions {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        button,
        a {
            min-height: 46px;
            border-radius: 14px;
            font: inherit;
            font-weight: 750;
            text-decoration: none;
        }

        button {
            border: 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 10px 22px rgba(67, 97, 238, 0.24);
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            color: #24314a;
            background: #fff;
        }

        .offline-footer {
            margin-top: 20px;
            color: #8a94a6;
            font-size: 0.78rem;
        }
    </style>
</head>
<body>
    <main class="offline-card" aria-label="KLASORA hors connexion">
        <img class="offline-logo" src="/static/img/icons/icon-192x192.png" alt="KLASORA">
        <div class="offline-kicker">
            <span class="offline-dot" id="statusDot"></span>
            <span id="statusText">Mode hors ligne</span>
        </div>
        <h1>Vous etes hors connexion</h1>
        <p>
            Les pages deja ouvertes peuvent rester disponibles. Les donnees non chargees et les actions serveur
            reprendront quand Internet reviendra.
        </p>
        <div class="offline-note">
            Connexion Internet requise pour vous authentifier.
        </div>
        <div class="offline-actions">
            <button type="button" onclick="window.location.reload()">Reessayer</button>
            <a href="/">Retour a l'accueil</a>
        </div>
        <div class="offline-footer">KLASORA PWA</div>
    </main>

    <script>
        function updateStatus() {
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('statusText');
            if (navigator.onLine) {
                if (dot) dot.style.background = '#16a34a';
                if (text) text.textContent = 'Connexion retablie';
                setTimeout(function () {
                    window.location.reload();
                }, 700);
            } else {
                if (dot) dot.style.background = '#e11d48';
                if (text) text.textContent = 'Mode hors ligne';
            }
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>
</body>
</html>
