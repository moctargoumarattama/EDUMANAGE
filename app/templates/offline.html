<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4361ee">
    <title>Hors connexion - KLASORA</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/static/img/icons/icon-192x192.png">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a0ca3;
            --surface: #ffffff;
            --bg: #f8f9fc;
            --text: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .offline-card {
            background: var(--surface);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(67, 97, 238, 0.08), 0 4px 12px rgba(0, 0, 0, 0.05);
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border);
        }
        .logo-wrap {
            margin-bottom: 1.5rem;
        }
        .logo-wrap img {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.15);
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #fff5f5;
            color: #e53e3e;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 1.8rem;
        }
        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 0.75rem;
        }
        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.9rem;
            background: #edf2f7;
            color: #4a5568;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e53e3e;
        }
        .status-dot.online {
            background: #38a169;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.85rem 1.5rem;
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
            text-decoration: none;
        }
        .btn-retry:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .btn-retry:active {
            transform: translateY(1px);
        }
        .brand-footer {
            margin-top: 1.75rem;
            font-size: 0.8rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="logo-wrap">
            <img src="/static/img/icons/icon-192x192.png" alt="KLASORA Logo" onerror="this.style.display='none'">
        </div>
        <div class="icon-circle">
            ⚡
        </div>
        <h1>Vous êtes hors connexion</h1>
        <div class="status-badge" id="connectionBadge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Aucune connexion Internet</span>
        </div>
        <p>
            Certaines fonctionnalités de KLASORA nécessitent une connexion active. Vos données sont protégées.
        </p>
        <button class="btn-retry" id="retryBtn" onclick="window.location.reload()">
            🔄 Réessayer la connexion
        </button>
        <div class="brand-footer">
            KLASORA • Plateforme Scolaire
        </div>
    </div>

    <script>
        function updateStatus() {
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('statusText');
            if (navigator.onLine) {
                if (dot) dot.className = 'status-dot online';
                if (text) text.textContent = 'Connexion rétablie ! Rechargement...';
                setTimeout(function() {
                    window.location.reload();
                }, 800);
            } else {
                if (dot) dot.className = 'status-dot';
                if (text) text.textContent = 'Aucune connexion Internet';
            }
        }
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
    </script>
</body>
</html>
