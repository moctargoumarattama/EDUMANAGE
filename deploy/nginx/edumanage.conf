# ==============================================================================
# KLASORA (EDUMANAGE) - Configuration Nginx Haute Performance
# Fichier : /etc/nginx/sites-available/edumanage.conf
# ==============================================================================

upstream edumanage_app {
    server 127.0.0.1:5005 fail_timeout=0;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# REDIRECTION HTTP -> HTTPS (Activer en production avec certificat SSL)
# ------------------------------------------------------------------------------
# server {
#     listen 80;
#     listen [::]:80;
#     server_name votre-domaine.com www.votre-domaine.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Configuration SSL / TLS & HTTP/2 (Optionnel / Production)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/votre-domaine.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/votre-domaine.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    server_name _;

    # Masquage de la version Nginx pour la sécurité
    server_tokens off;

    # Limite de taille de téléversement (Photos élèves, Imports Excel/CSV, Bulletins)
    client_max_body_size 16M;

    # Timeouts client
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # --------------------------------------------------------------------------
    # EN-TÊTES DE SÉCURITÉ GLOBAUX
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # COMPRESSION GZIP AVANCÉE
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/javascript;

    # --------------------------------------------------------------------------
    # SERVICE WORKER PWA (STRICTEMENT JAMAIS EN CACHE)
    # Permet la détection et l'application immédiate des mises à jour applicatives
    # --------------------------------------------------------------------------
    location = /service-worker.js {
        proxy_pass http://edumanage_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /static/service-worker.js {
        proxy_pass http://edumanage_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # --------------------------------------------------------------------------
    # WEB APP MANIFEST
    # --------------------------------------------------------------------------
    location = /manifest.json {
        proxy_pass http://edumanage_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # --------------------------------------------------------------------------
    # ASSETS STATIQUES (DIRECTEMENT PAR NGINX - CACHE 30 JOURS)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/edumanage/app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri @proxy_to_app;
    }

    # --------------------------------------------------------------------------
    # APPLICATION DYNAMIQUE FLASK VIA GUNICORN
    # --------------------------------------------------------------------------
    location / {
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        proxy_pass http://edumanage_app;
        proxy_redirect off;
        proxy_http_version 1.1;

        # Headers de transmission client réel (compatible werkzeug ProxyFix)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts Proxy
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Optimisations de tampons
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # Logs
    access_log /var/log/nginx/edumanage_access.log;
    error_log /var/log/nginx/edumanage_error.log warn;
}
